<style>:root{--brand:#0f5132;--brand-2:#1f7a4d;--brand-soft:#e7f3ec;--accent:#b8860b;--bg:#f4f6f5;--panel:#ffffff;--ink:#16211b;--muted:#5d6b63;--line:#dfe5e1;

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

.nav button:hover{background:rgba(255,255,255,.08)}.nav button.on{background:rgba(255,255,255,.16);font-weight:600}
.nav svg{width:17px;height:17px;flex:none;opacity:.9}
.side-foot{padding:10px 14px;font-size:11px;opacity:.6;border-top:1px solid rgba(255,255,255,.12)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:58px}
.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.burger{display:none}
.chip-net{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand-2);white-space:nowrap}
.chip-net.off{background:#fde8e8;color:var(--bad)}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--brand-soft);border:2px solid var(--line);cursor:zoom-in;flex:none}
.user-box{display:flex;align-items:center;gap:8px}.user-name{font-size:12.5px;line-height:1.2;text-align:right}.user-name small{color:var(--muted);display:block}
.content{padding:18px;max-width:1400px;width:100%;margin:0 auto}

.card h2 .sp{flex:1}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(31,122,77,.15)}
.in.bad{border-color:var(--bad)}
label.f{display:block;margin-bottom:10px}label.f>span{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}

.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#eef2f0;color:#33463b;white-space:nowrap}
.b-ok{background:#dcfce7;color:#166534}.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#991b1b}.b-info{background:#dbeafe;color:#1e40af}.b-mute{background:#eceff1;color:#455a64}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}

.progress{height:8px;background:var(--brand-soft);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--brand-2)}

.modal-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.modal-h h3{margin:0;font-size:16px;flex:1}
.modal-b{padding:16px}.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}

.toast{background:#13241b;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px}
.toast.bad{background:#7f1d1d}.toast.ok{background:#14532d}
.zoom-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;overflow:hidden;touch-action:none;cursor:grab}
.zoom-bg img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;user-select:none;-webkit-user-drag:none}
.zoom-ctl{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.zoom-ctl button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:15px}
/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:linear-gradient(150deg,var(--brand) 0%,#0b3b25 60%,#082a1a 100%);color:#e8f5ee;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art svg.bg{position:absolute;right:-60px;bottom:-40px;width:520px;opacity:.12}
.login-art h2{font-size:30px;line-height:1.15;margin:0 0 10px;max-width:460px}
.login-art ul{padding-left:18px;opacity:.85;max-width:440px}
.login-box{display:flex;align-items:center;justify-content:center;padding:28px}
.login-card{width:100%;max-width:380px}
.login-card .logo{width:64px;height:64px;border-radius:14px;border:1px solid var(--line)}
.print-only{display:none}
/* ---------- responsive ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:min(84vw,300px);z-index:900;transform:translateX(-102%);transition:transform .2s}
 .app.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
 .btn.burger{display:inline-flex}.top h1{font-size:15px}.card h2 .btn{padding:6px 10px;font-size:13px}.g2,.g3{grid-template-columns:1fr}.content{padding:12px}.top{padding:8px 12px}.user-name{display:none}
 .login{grid-template-columns:1fr}.login-art{display:none}.map{height:62vh}
 .tbl th,.tbl td{padding:7px 8px}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:21px}.modal-bg{padding:0}.modal{border-radius:0;min-height:100vh}}
@media print{body:not(:has(#printOverlay)) .side,body:not(:has(#printOverlay)) .top,body:not(:has(#printOverlay)) .bar,body:not(:has(#printOverlay)) .btn,#toasts{display:none!important}.app{display:block}.content{padding:0}.card{box-shadow:none;break-inside:avoid}.print-only{display:block}body{background:#fff}}
.label-sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(62mm,1fr));gap:4mm}
.label{border:1px dashed #999;padding:3mm;display:flex;gap:3mm;align-items:center;font-size:10px;break-inside:avoid;background:#fff;color:#000}
.label svg{width:24mm;height:24mm;flex:none}.label b{font-size:11px;display:block;word-break:break-all}

.legal h4{margin:14px 0 4px;font-size:13.5px;color:var(--brand-2)}.legal p,.legal li{font-size:13px}.legal ul{padding-left:18px;margin:4px 0}.legal .tbl{margin:6px 0}
#bootSplash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-family:system-ui,sans-serif}

.zoombar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}.zoombar .zt{width:auto;max-width:190px;padding:6px 8px;font-size:13px}

.pt-grid{position:absolute;inset:0;pointer-events:none;z-index:500}

.ssu-lbl{background:rgba(255,255,255,.85);border:0;box-shadow:none;font-weight:700;font-size:11px;padding:0 3px}

      if (f.json && v) { try { v = JSON.parse(v); } catch (e) { err.textContent = 'JSON tidak valid.'; ok = false; } } }
    if (f.type === 'checks' && f.required && !v.length) { err.textContent = 'Pilih minimal satu.'; ok = false; }
    out[f.name] = v;
  });
  return ok ? out : null;
}

/**
 * Tabel data server-side: pencarian, filter, pagination, loading/empty/error state.
 * cfg: {table, cols:[{k,label,fmt}], filter, actions:(row)=>html, onAction:(act,row)=>{}, searchable}
 */
function dataTable(el, cfg) {
  const st = { page: 1, q: '', size: cfg.size || 25, filter: Object.assign({}, cfg.filter || {}) };
  el.innerHTML = `<div class="bar">${cfg.searchable !== false ? `<input class="in" style="max-width:280px" placeholder="Cari kode/nama…" data-q>` : ''}${cfg.filters || ''}<span class="sp"></span>${cfg.tools || ''}</div><div class="tbl-wrap"><table class="tbl"><thead><tr>${cfg.cols.map(c => `<th>${esc(c.label)}</th>`).join('')}${cfg.actions ? '<th></th>' : ''}</tr></thead><tbody></tbody></table></div><div class="pager"></div>`;
  const body = $('tbody', el), pager = $('.pager', el), span = cfg.cols.length + (cfg.actions ? 1 : 0);
  let rows = [];
  async function load() {
    body.innerHTML = `<tr><td colspan="${span}"><div class="state">Memuat data…</div></td></tr>`;
    try {
      const r = await api('crud.list', { table: cfg.table, page: st.page, size: st.size, q: st.q, filter: st.filter, sort: cfg.sort });
      rows = r.rows;
      body.innerHTML = rows.length ? rows.map((row, i) => `<tr data-i="${i}">${cfg.cols.map(c => `<td>${c.fmt ? c.fmt(row[c.k], row) : esc(row[c.k])}</td>`).join('')}${cfg.actions ? `<td class="nowrap right">${cfg.actions(row)}</td>` : ''}</tr>`).join('')
        : `<tr><td colspan="${span}"><div class="state">${esc(cfg.empty || 'Belum ada data.')}</div></td></tr>`;
      pager.innerHTML = `${r.total} data · hal ${r.page}/${r.pages} <button class="btn sm" data-p="-1" ${r.page <= 1 ? 'disabled' : ''}>‹</button><button class="btn sm" data-p="1" ${r.page >= r.pages ? 'disabled' : ''}>›</button>`;
      if (cfg.onLoad) cfg.onLoad(rows, r);
    } catch (e) { body.innerHTML = `<tr><td colspan="${span}"><div class="state err">Gagal memuat: ${esc(e.message)} <button class="btn sm" data-retry>Coba lagi</button></div></td></tr>`; }
  }
  el.addEventListener('click', e => {
    const p = e.target.closest('[data-p]'); if (p) { st.page += Number(p.dataset.p); load(); return; }
    if (e.target.closest('[data-retry]')) { load(); return; }
    const a = e.target.closest('[data-act]'); if (a && cfg.onAction) { const tr = a.closest('tr'); cfg.onAction(a.dataset.act, rows[Number(tr.dataset.i)], a); }
  });
  const q = $('[data-q]', el); if (q) q.addEventListener('input', debounce(() => { st.q = q.value; st.page = 1; load(); }, 350));
  $$('[data-filter]', el).forEach(s => s.addEventListener('change', () => { st.filter[s.dataset.filter] = s.value; st.page = 1; load(); }));
  load();
  return { reload: load, state: st, rows: () => rows };
}

/* ---------------------- Zoom gambar (logo & foto) ---------------------- */
function zoomImage(src, alt) {
  if (!src) return;
  const bg = document.createElement('div'); bg.className = 'zoom-bg';
  bg.innerHTML = `<img alt="${esc(alt || 'gambar')}"><div class="zoom-ctl"><button data-z="-1">−</button><button data-z="0">100%</button><button data-z="1">+</button><button data-z="x">Tutup ✕</button></div>`;
  const img = $('img', bg); img.src = src;
  let s = 1, x = 0, y = 0, base = 1;
  const apply = () => { img.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${s * base})`; };
  img.onload = () => { base = Math.min(innerWidth * 0.85 / img.naturalWidth, innerHeight * 0.8 / img.naturalHeight, 4); apply(); };
  const ptrs = new Map(); let startDist = 0, startS = 1, last = null;
  bg.addEventListener('wheel', e => { e.preventDefault(); s = Math.min(12, Math.max(0.3, s * (e.deltaY < 0 ? 1.15 : 0.87))); apply(); }, { passive: false });
  bg.addEventListener('pointerdown', e => { if (e.target.closest('.zoom-ctl')) return; bg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); last = e;
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; startDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); startS = s; } });
  bg.addEventListener('pointermove', e => { if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, e);
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; s = Math.min(12, Math.max(0.3, startS * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / startDist)); }
    else if (last) { x += e.clientX - last.clientX; y += e.clientY - last.clientY; last = e; } apply(); });
  const up = e => { ptrs.delete(e.pointerId); last = ptrs.size === 1 ? [...ptrs.values()][0] : null; };
  bg.addEventListener('pointerup', up); bg.addEventListener('pointercancel', up);
  bg.addEventListener('dblclick', () => { s = s > 1 ? 1 : 2.5; x = y = 0; apply(); });
  bg.addEventListener('click', e => { const z = e.target.closest('[data-z]'); if (!z) return; const v = z.dataset.z;
    if (v === 'x') return close(); if (v === '0') { s = 1; x = y = 0; } else s = Math.min(12, Math.max(0.3, s * (v === '1' ? 1.3 : 0.77))); apply(); });
  const key = e => { if (e.key === 'Escape') close(); if (e.key === '+') { s *= 1.3; apply(); } if (e.key === '-') { s *= 0.77; apply(); } };
  function close() { bg.remove(); removeEventListener('keydown', key); }
  addEventListener('keydown', key);
  document.body.appendChild(bg);
}

/** Baca file gambar, kecilkan ke maxPx, kompres sampai ≤ maxChars (data URL). */
function imageToDataUrl(file, maxPx, maxChars, type = 'image/jpeg') {
  return new Promise((res, rej) => {
    if (!/^image\/(jpeg|png|webp|svg\+xml)$/.test(file.type)) return rej(new Error('Format gambar harus JPEG/PNG/WebP/SVG.'));
    if (file.type === 'image/svg+xml') { if (file.size > 300000) return rej(new Error('SVG terlalu besar.')); const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(file); return; }
    const img = new Image(); img.onerror = () => rej(new Error('Gambar tidak dapat dibaca.'));
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, maxPx / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
      if (type === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); }
      g.drawImage(img, 0, 0, w, h);
      let q = 0.85, out = c.toDataURL(type, q);
      while (out.length > maxChars && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      if (out.length > maxChars) return rej(new Error('Gambar masih terlalu besar setelah kompresi.'));
      URL.revokeObjectURL(img.src); res(out);
    };
    img.src = URL.createObjectURL(file);
  });
}
function pickFile(accept) { return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => res(i.files[0] || null); i.click(); }); }

  S.page = page; location.hash = page;
  $$('.nav [data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === page));
  const item = MENU.flatMap(m => m[1]).find(i => i[0] === page); $('#pageTitle').textContent = item ? item[1] : '';
  $('#content').onclick = null; $('#content').innerHTML = '<div class="state">Memuat…</div>';
  Promise.resolve(Pages[page]()).catch(e => { $('#content').innerHTML = `<div class="card state err">${esc(e.message)}</div>`; });
}
function splash(msg) { const el = $('#bootMsg'); if (el) el.textContent = msg; }
async function boot() {
  window.__ssuBooted = true;
  applyBranding();
  if (!S.session) { renderLogin(); loadPublicSettings(); return; }   // login tampil SEGERA, server dicek di latar
  try {
    splash('Memeriksa sesi…');
    // satu round-trip: profil, hak akses, lisensi, meta, estate, pengaturan (dulu 5 panggilan berurutan)
    const b = S.bootData || await api('auth.bootstrap', {}, { timeout: 25000 }); S.bootData = null;
    S.me = b.me; S.meta = b.meta; S.estates = b.estates; S.settings = b.settings; S.serverOk = true;
    LS.set('me', S.me); LS.set('settings', S.settings); LS.set('meta', S.meta); applyBranding();
  } catch (e) {
    if (e.code === 'NETWORK' && LS.get('me', null)) { S.me = LS.get('me'); S.meta = LS.get('meta', { roleLabel: {}, flow: { Sample: {}, Campaign: {} } }); toast('Offline: mode lapangan memakai data terakhir di perangkat.', ''); }
    else if (e.code === 'MUST_CHANGE' || e.code === 'MUST_ACCEPT') { S.me = S.me || { name: '', roles: [], perms: [] }; return; }
    else { if (e.code === 'AUTH') { S.session = null; LS.del('session'); } return renderLogin(e.message); }
  }
  if (S.me.needsConsent) return consentFlow();
  renderShell(); await Sync.recover(); Sync.run();
  if (can('read')) setTimeout(() => ['Organizations', 'Divisions', 'Protocols', 'LabParameters', 'Laboratories'].forEach(t => listAll(t).catch(() => {})), 1500);   // hangatkan cache
  const allowed = MENU.flatMap(m => m[1]).filter(i => can(i[3])).map(i => i[0]), want = location.hash.slice(1);
  go(!navigator.onLine && can('field.write') ? 'field' : (allowed.includes(want) ? want : (can('read') ? 'dashboard' : 'field')));   // halaman di luar hak peran → beranda
}

/* Modul peta: foto udara PMTiles offline, loncat ke wilayah, cetak peta A4/A3 bergaya layout ArcGIS. */
const PMTILES_URL = 'https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js';

/* ============================ Foto udara (PMTiles) ============================ */
const Aerial = (() => {
  const inst = new Map();   // id -> {pm, header}
  const MIME = { 2: 'image/png', 3: 'image/jpeg', 4: 'image/webp', 5: 'image/avif' };
  async function lib() { await loadScript(PMTILES_URL, 'pmtiles'); return window.pmtiles; }
  async function open(rec) {
    if (inst.has(rec.id)) return inst.get(rec.id);

/* ============================ Loncat ke wilayah ============================ */
function boundsOfGeoms(geoms) {
  let b = null;
  geoms.filter(Boolean).forEach(g => { const l = L.geoJSON(g).getBounds(); if (l.isValid()) b = b ? b.extend(l) : l; });
  return b;
}
/** Bar pilihan berjenjang Organisasi/PT → Estate → Afdeling → Blok → SSU. */
async function zoomToBar(el, m, data) {
  const { orgs, estates, divisions, blocks, ssus } = data;
  el.innerHTML = `<span class="muted" style="font-size:12.5px">Loncat ke:</span>
    <select class="in zt" data-zt="org"><option value="">Organisasi / PT</option>${orgs.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select>
    <select class="in zt" data-zt="est"><option value="">Estate</option></select><select class="in zt" data-zt="div"><option value="">Afdeling</option></select>
    <select class="in zt" data-zt="blk"><option value="">Blok</option></select><select class="in zt" data-zt="ssu"><option value="">SSU</option></select>
    <input class="in zt" data-zt="xy" placeholder="lat, lng" style="max-width:150px" title="Ke koordinat desimal, mis. -7.35, 108.2">`;
  const sel = k => $(`[data-zt="${k}"]`, el);
  const fill = (k, rows, label, fmt) => { sel(k).innerHTML = `<option value="">${label}</option>` + rows.map(r => `<option value="${esc(r.id)}">${esc(fmt(r))}</option>`).join(''); };
  let hl = null, mk = null;
  function show(geoms, label) {
    if (hl) m.removeLayer(hl);
    const b = boundsOfGeoms(geoms);
    if (!b) return toast('Belum ada geometri (blok/SSU) untuk ' + label + '.', 'bad');
    hl = L.layerGroup([L.rectangle(b.pad(0.02), { color: '#facc15', weight: 3, fill: false, dashArray: '6 4', interactive: false })]
      .concat(geoms.filter(Boolean).map(g => L.geoJSON(g, { style: { color: '#facc15', weight: 3, fill: false }, interactive: false })))).addTo(m);
    m.flyToBounds(b, { padding: [30, 30], duration: 0.6, maxZoom: 18 });
    const mine = hl; setTimeout(() => { if (hl === mine && hl) { m.removeLayer(hl); hl = null; } }, 4500);   // sorotan memudar
    toast('Peta: ' + label, '');
  }
  const geomsOfEstate = id => blocks.filter(x => x.estateId === id).map(x => x.geomJ).concat(ssus.filter(x => x.estateId === id).map(x => x.geomJ));
  const refill = () => {
    const o = sel('org').value, e = sel('est').value, d = sel('div').value;
    const es = estates.filter(x => !o || x.orgId === o);
    if (document.activeElement === sel('org') || !es.some(x => x.id === e)) fill('est', es, 'Estate', x => x.code + ' — ' + x.name);
    const ev = sel('est').value, ds = divisions.filter(x => !ev || x.estateId === ev);
    if (document.activeElement !== sel('div') && document.activeElement !== sel('blk')) fill('div', ds, 'Afdeling', x => x.code + ' — ' + x.name);
    const dv = sel('div').value;
    fill('blk', blocks.filter(x => (!ev || x.estateId === ev) && (!dv || x.divisionId === dv)), 'Blok', x => x.code + (x.name ? ' — ' + x.name : ''));
    fill('ssu', ssus.filter(x => (!ev || x.estateId === ev) && (!dv || x.divisionId === dv)), 'SSU', x => x.code + ' — ' + x.name);
  };
  refill();
  el.addEventListener('change', e => {
    const k = e.target.dataset.zt, v = e.target.value; if (!k || !v) return;
    if (k === 'org') { const es = estates.filter(x => x.orgId === v); sel('est').value = ''; sel('div').value = ''; refill(); show(es.flatMap(x => geomsOfEstate(x.id)), (orgs.find(x => x.id === v) || {}).name); }
    if (k === 'est') { sel('div').value = ''; refill(); show(geomsOfEstate(v), 'estate ' + (estates.find(x => x.id === v) || {}).name); }
    if (k === 'div') { refill(); show(blocks.filter(x => x.divisionId === v).map(x => x.geomJ).concat(ssus.filter(x => x.divisionId === v).map(x => x.geomJ)), 'afdeling ' + (divisions.find(x => x.id === v) || {}).name); }
    if (k === 'blk') { const b = blocks.find(x => x.id === v); show([b && b.geomJ], 'blok ' + (b || {}).code); }
    if (k === 'ssu') { const s = ssus.find(x => x.id === v); show([s && s.geomJ], 'SSU ' + (s || {}).code); }
    if (k === 'xy') {
      const p = v.split(/[ ,;]+/).map(Number);
      if (p.length !== 2 || !p.every(isFinite) || Math.abs(p[0]) > 90 || Math.abs(p[1]) > 180) return toast('Format koordinat: lat, lng (desimal)', 'bad');
      if (mk) m.removeLayer(mk); mk = L.circleMarker(p, { radius: 8, color: '#fff', weight: 2, fillColor: '#dc2626', fillOpacity: 1 }).addTo(m).bindPopup(p[0].toFixed(6) + ', ' + p[1].toFixed(6)).openPopup(); m.flyTo(p, Math.max(m.getZoom(), 17), { duration: 0.6 });
    }
  });
}

    if (!v.opts.includes('grid')) return;
    const b = pm.getBounds(), span = Math.max(b.getEast() - b.getWest(), b.getNorth() - b.getSouth());
    const steps = [1 / 3600, 2 / 3600, 5 / 3600, 10 / 3600, 15 / 3600, 30 / 3600, 1 / 60, 2 / 60, 5 / 60, 10 / 60, 15 / 60, 30 / 60, 1, 2, 5];
    const st = steps.find(x => span / x <= 6) || 5, lines = [], sz = pm.getSize();
    for (let x = Math.ceil(b.getWest() / st) * st; x < b.getEast(); x += st) {
      lines.push(L.polyline([[b.getSouth(), x], [b.getNorth(), x]], { color: '#333', weight: 0.6, opacity: 0.45, dashArray: '2 4', interactive: false }));
      const px = pm.latLngToContainerPoint([b.getCenter().lat, x]).x / sz.x * 100;
      g.insertAdjacentHTML('beforeend', `<span class="gx t" style="left:${px}%">${dms(x, 'BT', 'BB')}</span><span class="gx b" style="left:${px}%">${dms(x, 'BT', 'BB')}</span>`);
    }
    for (let y = Math.ceil(b.getSouth() / st) * st; y < b.getNorth(); y += st) {
      lines.push(L.polyline([[y, b.getWest()], [y, b.getEast()]], { color: '#333', weight: 0.6, opacity: 0.45, dashArray: '2 4', interactive: false }));
      const py = pm.latLngToContainerPoint([y, b.getCenter().lng]).y / sz.y * 100;
      g.insertAdjacentHTML('beforeend', `<span class="gy l" style="top:${py}%">${dms(y, 'LU', 'LS')}</span><span class="gy r" style="top:${py}%">${dms(y, 'LU', 'LS')}</span>`);
    }
    gridLayer = L.layerGroup(lines).addTo(pm);
  }
  pm.on('moveend zoomend', update); setTimeout(() => { pm.invalidateSize(); if (inm) inm.invalidateSize(); update(); }, 60);

  function tilesReady(ms) {   // tunggu ubin semua lapisan termuat (atau batas waktu)
    return new Promise(res => {
      const layers = []; pm.eachLayer(l => { if (l instanceof L.GridLayer) layers.push(l); }); if (inm) inm.eachLayer(l => { if (l instanceof L.GridLayer) layers.push(l); });
      const busy = () => layers.some(l => l._loading);
      const t0 = Date.now(); (function poll() { if (!busy() || Date.now() - t0 > ms) res(); else setTimeout(poll, 150); })();
    });
  }
  $('#ptGo').onclick = async () => { $('#ptGo').disabled = true; $('#ptGo').textContent = 'Menyiapkan ubin peta…'; await tilesReady(10000); $('#ptGo').disabled = false; $('#ptGo').textContent = 'Cetak / Simpan PDF'; window.print(); };
  return { map: pm, close, ready: () => tilesReady(10000), wrap };
}

/* Dokumentasi foto: kompres di perangkat → Google Drive (sheet hanya menyimpan URL). Galeri, unggah, viewer, antrean offline. */
const DOC_CATS = ['Kondisi lahan', 'Profil tanah', 'Titik sampling', 'Pengambilan sampel', 'Label & kemasan', 'Serah terima / pengiriman', 'Laboratorium', 'Kegiatan agronomi', 'Lainnya'];
const DOC_ENT = { Estates: 'Estate', Blocks: 'Blok', SoilUnits: 'SSU', Campaigns: 'Kampanye', SamplingPoints: 'Titik sampling', Samples: 'Sampel', Shipments: 'Pengiriman', LabImports: 'Impor lab', Recommendations: 'Rekomendasi' };
const THUMBS = new Map();   // id -> dataUrl (cache memori sesi)

/** Kompres foto: maks 1600 px, JPEG, target ≤ ±350 KB. Mengembalikan {dataUrl, width, height, takenAt}. */
function compressPhoto(file) {
  return new Promise((res, rej) => {
    if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type) && !/\.(jpe?g|png|webp)$/i.test(file.name)) return rej(new Error(file.name + ': bukan berkas foto.'));
    const img = new Image(); img.onerror = () => rej(new Error(file.name + ': foto tidak dapat dibaca (format HEIC? ubah ke JPEG).'));
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      let q = 0.8, out = c.toDataURL('image/jpeg', q);
      while (out.length > 470000 && q > 0.4) { q -= 0.08; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(img.src);
      res({ dataUrl: out, width: w, height: h, takenAt: new Date(file.lastModified || Date.now()).toISOString(), name: file.name, originalBytes: file.size });
    };
    img.src = URL.createObjectURL(file);
  });
}
function pickFiles(accept, capture) {
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = true; if (capture) i.capture = 'environment'; i.onchange = () => res([...i.files]); i.click(); });
}
async function loadThumbs(root) {
  const want = $$('[data-thumb]', root).map(x => x.dataset.thumb).filter(id => !THUMBS.has(id));
  for (let i = 0; i < want.length; i += 24) {
    try { const r = await api('doc.thumb', { ids: want.slice(i, i + 24) }); Object.keys(r).forEach(id => THUMBS.set(id, r[id])); } catch (e) { break; }
    paintThumbs(root);
  }
  paintThumbs(root);
}
function paintThumbs(root) { $$('[data-thumb]', root).forEach(el => { const v = THUMBS.get(el.dataset.thumb); if (v) { el.style.backgroundImage = `url("${v}")`; el.classList.add('ok'); } else if (THUMBS.has(el.dataset.thumb)) el.classList.add('none'); }); }

async function uploadDocs(target, after) {
  target = target || {};
  const entOpts = Object.keys(DOC_ENT).map(k => ({ value: k, label: DOC_ENT[k] }));
  const fields = [{ name: 'category', label: 'Kategori', type: 'select', required: true, options: DOC_CATS }, { name: 'caption', label: 'Keterangan (berlaku untuk semua foto terpilih)', placeholder: 'mis. Profil tanah SSU01 kedalaman 0–40 cm' },
    { name: 'gps', label: 'Lokasi', type: 'checks', options: [{ value: '1', label: 'Sertakan posisi GPS perangkat saat ini' }] }];
  if (!target.entity) fields.unshift({ name: 'entity', label: 'Terkait dengan', type: 'select', required: true, options: entOpts }, { name: 'entityId', label: 'Objek', type: 'select', options: [] });
  const box = document.createElement('div'); let files = [];
  box.innerHTML = `${target.label ? `<p>Untuk: <b>${esc(target.label)}</b></p>` : ''}<form onsubmit="return false">${formHtml(fields, { category: target.category })}</form>
    <div class="bar"><button class="btn" id="dpPick">${ic('plus')} Pilih foto</button><button class="btn" id="dpCam">Ambil dari kamera</button><span class="muted" id="dpN">Belum ada foto dipilih</span></div>
    <div class="doc-grid" id="dpPrev"></div><p class="help">Foto dikompres di perangkat (maks 1600 px, ±150–350 KB) lalu disimpan di Google Drive organisasi. Spreadsheet hanya menyimpan alamat (URL) — tidak terkena batas 50.000 karakter per sel.</p><div id="dpProg" class="help"></div>`;
  const addFiles = async list => {
    for (const f of list) { try { const c = await compressPhoto(f); files.push(c); $('#dpPrev', box).insertAdjacentHTML('beforeend', `<div class="doc-card"><div class="doc-th ok" style="background-image:url('${c.dataUrl}')"></div><div class="doc-meta"><span>${esc(c.name)}</span><span>${fmtBytes(c.originalBytes)} → ${fmtBytes(Math.round(c.dataUrl.length * 0.75))}</span></div></div>`); } catch (e) { toast(e.message, 'bad'); } }
    $('#dpN', box).textContent = files.length + ' foto siap';
  };
  return modal('Unggah dokumentasi foto', box, [{ label: 'Batal' }, { label: 'Unggah', cls: 'pri', onClick: async b => {
    const v = formRead(b, fields); if (!v) return false; if (!files.length) { toast('Pilih minimal satu foto.', 'bad'); return false; }
    const ent = target.entity || v.entity, eid = target.entityId || v.entityId || '', est = target.estateId || S.estateId || '';
    if (!eid && ent !== 'Estates' && !est) { toast('Pilih objek atau estate.', 'bad'); return false; }
    let pos = null; if (v.gps && v.gps.length) pos = await new Promise(r => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => r(p.coords), () => r(null), { enableHighAccuracy: true, timeout: 15000 }) : r(null));
    let ok = 0, queued = 0;
    for (let i = 0; i < files.length; i++) {
      const c = files[i]; $('#dpProg', b).textContent = 'Mengunggah ' + (i + 1) + '/' + files.length + '…';
      const payload = { entity: ent, entityId: ent === 'Estates' ? (eid || est) : eid, estateId: est, category: v.category, caption: v.caption, takenAt: c.takenAt, width: c.width, height: c.height, lat: pos ? pos.latitude : '', lng: pos ? pos.longitude : '' };
      if (!navigator.onLine) { await Sync.enqueue('document', Object.assign({ photo: c.dataUrl }, payload)); queued++; continue; }
      try { await api('doc.upload', Object.assign({ dataUrl: c.dataUrl }, payload), { timeout: 90000 }); ok++; }
      catch (e) { if (e.code === 'NETWORK') { await Sync.enqueue('document', Object.assign({ photo: c.dataUrl }, payload)); queued++; } else { toast(c.name + ': ' + e.message, 'bad'); } }
    }
    toast(ok + ' foto diunggah ke Google Drive' + (queued ? ', ' + queued + ' menunggu sinkron (offline)' : '') + '.', ok || queued ? 'ok' : 'bad');
    after && after(); return true;
  } }], { wide: true, onOpen: b => {
    $('#dpPick', b).onclick = async () => addFiles(await pickFiles('image/*'));
    $('#dpCam', b).onclick = async () => addFiles(await pickFiles('image/*', true));
    const es = $('[name="entity"]', b);
    if (es) es.onchange = async () => {
      const t = es.value, sel = $('[name="entityId"]', b); sel.innerHTML = '<option value="">— memuat… —</option>';
      if (t === 'Estates') { sel.innerHTML = S.estates.map(e => `<option value="${esc(e.id)}"${e.id === S.estateId ? ' selected' : ''}>${esc(e.code)} — ${esc(e.name)}</option>`).join(''); return; }
      const rows = await listAll(t, estateFilter()).catch(() => []);
      sel.innerHTML = '<option value="">— pilih —</option>' + rows.slice(0, 2000).map(r => `<option value="${esc(r.id)}">${esc(r.code || r.fileName || r.title || r.id)}${r.name ? ' — ' + esc(r.name) : ''}</option>`).join('');
    };
  } });
}

function makeMap(el, opt = {}) {
  if (typeof L === 'undefined') { el.innerHTML = '<div class="state err">Pustaka peta belum termuat (offline pertama kali?).</div>'; return null; }
  const m = L.map(el, { zoomControl: true, maxZoom: 22 }).setView([-2.5, 117], 5);
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22, maxNativeZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(m);
  const img = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 22, maxNativeZoom: 19, attribution: 'Tiles © Esri — Esri, Maxar, Earthstar Geographics' });
  m._ctl = L.control.layers({ 'OpenStreetMap': osm, 'Citra satelit (Esri)': img }, {}).addTo(m);
  m._baseName = 'OpenStreetMap'; m.on('baselayerchange', e => { m._baseName = e.name; });
  L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(m);
  // foto udara PMTiles yang tersimpan di perangkat ikut tampil (juga saat offline)
  m._aerialReady = opt.aerial === false ? Promise.resolve([]) : Aerial.attach(m).catch(() => []);
  setTimeout(() => m.invalidateSize(), 200);
  return m;
}

const MAP_LEGEND = [[SSU_COLOR.APPROVED, 'SSU disetujui'], [SSU_COLOR.DRAFT, 'SSU draft'], ['transparent', 'Batas blok', 'border:2px dashed #b8860b'], [PT_COLOR.PLANNED, 'Titik rencana'], [PT_COLOR.OBSERVED, 'Titik teramati (aktual)']];
function mapThematic(data) {   // lapisan tematik dapat dibuat ulang (dipakai juga oleh peta cetak)
  return m => {
    const bl = L.geoJSON({ type: 'FeatureCollection', features: data.blocks.filter(b => b.geomJ).map(b => ({ type: 'Feature', geometry: b.geomJ, properties: b })) },
      { style: { color: '#b8860b', weight: 1.5, dashArray: '4 3', fill: false } }).bindPopup(l => 'Blok ' + esc(l.feature.properties.code) + (l.feature.properties.areaHa ? ' · ' + num(l.feature.properties.areaHa) + ' ha' : ''));
    const sl = L.geoJSON({ type: 'FeatureCollection', features: data.ssus.map(x => ({ type: 'Feature', geometry: x.geomJ, properties: x })) },
      { style: f => ({ color: SSU_COLOR[f.properties.status] || '#555', weight: 2, fillOpacity: .18 }) })
      .bindPopup(l => { const p = l.feature.properties; return `<b>${esc(p.code)}</b> ${esc(p.name)}<br>${esc(p.soilType)}<br>Status: ${esc(p.status)} · v${esc(p.currentVersion)}<br>Luas: ${num(p.areaHa)} ha`; })
      .eachLayer(l => l.bindTooltip(esc(l.feature.properties.code), { permanent: !!data.labels, direction: 'center', className: 'ssu-lbl' }));
    bl.addTo(m); sl.addTo(m);
    const pl = data.points && data.points.length ? L.layerGroup(data.points.map(p => { const obs = p.status === 'OBSERVED' && p.actualLat !== '';
      return L.circleMarker(obs ? [p.actualLat, p.actualLng] : [p.planLat, p.planLng], { radius: 6, color: '#fff', weight: 1.5, fillColor: PT_COLOR[p.status], fillOpacity: 1 })
        .bindPopup(`<b>${esc(p.code)}</b><br>${esc(p.status)}<br>Rencana: ${num(p.planLat, 6)}, ${num(p.planLng, 6)}${obs ? `<br>Aktual: ${num(p.actualLat, 6)}, ${num(p.actualLng, 6)} (±${num(p.accuracy, 1)} m)` : ''}<br>Petugas: ${esc(p.assignedName || '-')}`); })).addTo(m) : null;
    return { bl, sl, pl };
  };
}

function startGps(cb) {

  if (GEO.watch !== null) navigator.geolocation.clearWatch(GEO.watch);
  GEO.watch = navigator.geolocation.watchPosition(p => { GEO.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy * 10) / 10, at: new Date(p.timestamp).toISOString() }; cb && cb(GEO.pos); },

}

}

/** Pembaca CSV bawaan (RFC 4180, pemisah , ; atau tab) — CSV dapat diimpor tanpa SheetJS & tanpa internet. */
const CsvLite = {
  parse(text) {
    text = String(text).replace(/^\ufeff/, '');
    const first = text.split(/\r?\n/, 1)[0], d = [';', '\t', ','].sort((a, b) => first.split(b).length - first.split(a).length)[0];
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; continue; }
      if (c === '"') q = true; else if (c === d) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  },
  read(text) { return { SheetNames: ['CSV'], Sheets: { CSV: { aoa: CsvLite.parse(text) } } }; },
  utils: {
    sheet_to_json(ws) { return ws.aoa; },
    sheet_to_csv(ws) { return ws.aoa.map(r => r.map(v => /[",\n;]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\n'); }
  }
};

      P_AV: ['pav', 'bray', 'olsen', 'ptersedia', 'pavail'], K_DD: ['kdd', 'kexch', 'ktukar'], CA_DD: ['cadd', 'caexch'], MG_DD: ['mgdd', 'mgexch'], KTK: ['ktk', 'cec'], AL_DD: ['aldd', 'alexch'],
      SAND: ['sand', 'pasir'], SILT: ['silt', 'debu'], CLAY: ['clay', 'liat'] };
    const norm = x => String(x).toLowerCase().replace(/[^a-z0-9]/g, '');
    const guess = h => { const n = norm(h); return params.find(p => n.includes(norm(p.code))) || params.find(p => (ALIAS[p.code] || []).some(a => n.includes(a))) || params.find(p => n === norm(p.name)); };
    $('#liMap').innerHTML = `<h4>Pemetaan kolom (${rows.length} baris data)</h4><div class="grid g3"><label class="f"><span>Kolom ID sampel *</span><select class="in" id="liId">${headers.map(h => `<option ${/kode|id|sample|sampel/i.test(h) ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select></label>
      <label class="f"><span>Kolom metode (opsional)</span><select class="in" id="liMet"><option value="">— tidak ada —</option>${headers.map(h => `<option ${/metode|method/i.test(h) ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select></label></div>
      <div class="tbl-wrap"><table class="tbl"><tr><th>Kolom file</th><th>Parameter sistem</th><th>Satuan di file</th></tr>${headers.map((h, i) => { const g = guess(h); return `<tr><td>${esc(h)}</td><td><select class="in" data-pm="${i}"><option value="">— abaikan —</option>${params.map(p => `<option value="${esc(p.code)}" ${g && g.code === p.code ? 'selected' : ''}>${esc(p.code)} — ${esc(p.name)} (${esc(p.unit)})</option>`).join('')}</select></td><td><input class="in" data-un="${i}" value="${esc(g ? g.unit : '')}" placeholder="satuan"></td></tr>`; }).join('')}</table></div>
      <div class="bar" style="margin-top:10px"><label class="chk"><input type="checkbox" id="liRev"> Mode revisi (hasil yang sudah ada akan direvisi)</label><input class="in" id="liWhy" placeholder="Alasan revisi" style="max-width:280px"><label class="chk"><input type="checkbox" id="liPart"> Impor baris valid saja bila ada galat</label><span class="sp"></span><button class="btn" id="liDry">Uji (dry-run)</button><button class="btn pri" id="liGo">Impor</button></div>`;
    $$('[data-pm]').forEach(s => s.onchange = () => { const p = params.find(x => x.code === s.value); if (p) $(`[data-un="${s.dataset.pm}"]`).value = p.unit; });
    $('#liDry').onclick = () => go2(true); $('#liGo').onclick = () => go2(false);
  };
  async function go2(dry) {
    const mapping = { sampleCode: $('#liId').value, method: $('#liMet').value || undefined, params: $$('[data-pm]').filter(s => s.value).map(s => ({ column: headers[Number(s.dataset.pm)], param: s.value, unit: $(`[data-un="${s.dataset.pm}"]`).value.trim() })) };
    if (!mapping.params.length) return toast('Petakan minimal satu kolom parameter.', 'bad');
    if (mapping.params.some(p => p.column === mapping.sampleCode)) return toast('Kolom ID sampel tidak boleh dipetakan sebagai parameter.', 'bad');
    const r = await run('lab.import', { labId: $('#liLab').value, fileName, headers, rows, mapping, sourceText: dry ? '' : srcText, dryRun: dry, allowRevision: $('#liRev').checked, revisionReason: $('#liWhy').value, acceptPartial: $('#liPart').checked });
    $('#liRep').innerHTML = `<div class="card" style="margin-top:12px"><h2>${dry ? 'Hasil uji (belum disimpan)' : r.blocked ? 'Impor diblokir' : 'Impor selesai'}</h2><p>${r.total} baris · ${r.newResults} hasil baru · ${r.revisions} revisi · ${r.errors.length} galat ${r.message ? '<br>' + esc(r.message) : ''}</p>
      ${r.errors.length ? `<div class="tbl-wrap" style="max-height:320px"><table class="tbl"><tr><th>Baris</th><th>Sampel</th><th>Parameter</th><th>Galat</th></tr>${r.errors.map(e => `<tr><td>${e.line}</td><td class="mono">${esc(e.sample || '')}</td><td>${esc(e.param || '')}</td><td>${esc(e.error)}</td></tr>`).join('')}</table></div><button class="btn sm" id="liErr">Unduh laporan galat (CSV)</button>` : ''}</div>`;
    const eb = $('#liErr'); if (eb) eb.onclick = () => download('galat_impor.csv', 'baris,sampel,parameter,galat\n' + r.errors.map(e => [e.line, e.sample || '', e.param || '', '"' + String(e.error).replace(/"/g, '""') + '"'].join(',')).join('\n'), 'text/csv');
    if (!dry && !r.blocked) toast('Tersimpan. Hasil berstatus PENDING/REVIEW menunggu validasi reviewer.', 'ok');
  }
  const openFile = async (name, getText, getBuf, size) => {
    if (size > 8e6) return toast('File > 8 MB. Pecah menjadi beberapa file.', 'bad');
    if (/\.(csv|txt)$/i.test(name)) { lib = CsvLite; wb = CsvLite.read(await getText()); }
    else {
      try { await loadScript(XLSX_URL, 'XLSX'); } catch (er) { return toast('Pustaka pembaca XLSX tidak dapat dimuat. Simpan berkas sebagai CSV lalu impor ulang (CSV tidak memerlukan internet).', 'bad'); }
      lib = XLSX; wb = XLSX.read(await getBuf(), { type: 'array', cellDates: false });
    }
    fileName = name;
    $('#liSh').innerHTML = wb.SheetNames.map(n => `<option>${esc(n)}</option>`).join(''); $('#liSh').onchange = parseSheet; parseSheet();
  };
  $('#liF').onchange = e => { const f = e.target.files[0]; if (f) openFile(f.name, () => f.text(), () => f.arrayBuffer(), f.size); };
  labImport.openText = (name, text) => openFile(name, async () => text, null, text.length);   // dipakai mode demo
  if (window.SSU_DEMO && SSU_DEMO.labImportHook) SSU_DEMO.labImportHook(body);
}

  }

    <label class="f"><span>Parameter</span><select class="in" id="anP">${params.map(p => `<option value="${esc(p.code)}">${esc(p.code)} — ${esc(p.name)}</option>`).join('')}</select></label>
    <label class="f"><span>Kedalaman</span><select class="in" id="anD">${depths.map(d => `<option>${esc(d)}</option>`).join('')}</select></label>
    <label class="f"><span>Kelompok</span><select class="in" id="anG"><option value="ssu">Per SSU</option><option value="block">Per blok</option><option value="division">Per afdeling</option><option value="estate">Per estate</option></select></label></div>
    <div class="bar"><button class="btn pri" id="anRun">Hitung statistik</button><button class="btn" id="anMap">Peta parameter</button><label class="chk"><input type="checkbox" id="anIdw"> Coba interpolasi IDW (bila data memadai)</label><span class="sp"></span><select class="in" id="anB" style="width:auto"><option value="">Bandingkan dgn kampanye…</option>${camps.map(c => `<option value="${esc(c.id)}">${esc(c.code)}</option>`).join('')}</select><button class="btn" id="anCmp">Bandingkan</button></div></div>
    <div class="card" id="anOut"><div class="state">Atur filter lalu hitung. Hanya hasil berstatus VALIDATED yang dipakai.</div></div><div class="card"><div class="map" id="anM"></div></div>`;
  const f = () => ({ estateId: S.estateId, campaignId: $('#anC').value, paramCode: $('#anP').value, depth: $('#anD').value, groupBy: $('#anG').value });
  const meta = m => `<p class="help">Sumber: ${esc(m.source || 'LabResults (VALIDATED)')} · parameter ${esc(m.paramCode)} · kedalaman ${esc(m.depth)} · kampanye ${esc(m.campaign || m.campaignId)} · periode ${esc(m.period || '-')} · n = ${esc(m.n)} · dibuat ${fmtDate(m.generatedAt, 1)} ${m.note ? '· ' + esc(m.note) : ''}</p>`;
  $('#anRun').onclick = async () => { const r = await run('analytics.stats', f());
    const max = Math.max(...r.rows.map(x => x.max || 0), 1);
    $('#anOut').innerHTML = `<h2>Statistik deskriptif<span class="sp"></span><button class="btn sm" id="anCsv">${ic('dl')} CSV</button></h2>${r.warning ? `<p>${badge('REVIEW', r.warning)}</p>` : ''}${meta(r.meta)}
      ${r.rows.length ? `<div class="tbl-wrap"><table class="tbl"><tr><th>Kelompok</th><th>n</th><th>Rata-rata</th><th>Median</th><th>SD</th><th>CV%</th><th>Min</th><th>Maks</th><th>Satuan</th><th>Metode</th><th style="min-width:140px"></th></tr>${r.rows.map(x => `<tr><td>${esc(x.label)}</td><td>${x.n}</td><td>${num(x.mean, 3)}</td><td>${num(x.median, 3)}</td><td>${num(x.sd, 3)}</td><td>${num(x.cv, 1)}</td><td>${num(x.min, 3)}</td><td>${num(x.max, 3)}</td><td>${esc(x.unit)}</td><td>${esc(x.method || '-')}</td><td><div class="progress"><i style="width:${Math.max(2, x.mean / max * 100)}%"></i></div></td></tr>`).join('')}</table></div>` : '<div class="state">Tidak ada hasil VALIDATED untuk filter ini.</div>'}`;
    const cb = $('#anCsv'); if (cb) cb.onclick = () => download('statistik_' + r.meta.paramCode + '.csv', 'kelompok,n,mean,median,sd,cv,min,max,unit,method\n' + r.rows.map(x => [x.label, x.n, x.mean, x.median, x.sd, x.cv, x.min, x.max, x.unit, x.method].join(',')).join('\n') + '\n#meta,' + JSON.stringify(r.meta).replace(/,/g, ';'), 'text/csv'); };
  $('#anCmp').onclick = async () => { const a = $('#anC').value, b = $('#anB').value; if (!a || !b || a === b) return toast('Pilih dua kampanye berbeda.', 'bad');
    const r = await run('analytics.compare', Object.assign(f(), { campaignA: a, campaignB: b }));
    $('#anOut').innerHTML = `<h2>Perbandingan antarperiode</h2><p class="help">${esc(r.meta.note)}</p><div class="tbl-wrap"><table class="tbl"><tr><th>SSU</th><th>Rata-rata A (n)</th><th>Rata-rata B (n)</th><th>Selisih B−A</th><th>Satuan / metode</th></tr>${r.rows.map(x => `<tr><td>${esc(x.ssu)}</td><td>${num(x.meanA, 3)} (${x.nA})</td><td>${x.comparable ? num(x.meanB, 3) + ' (' + x.nB + ')' : '<span class="muted">tidak sebanding</span>'}</td><td>${x.comparable ? num(x.delta, 3) : '-'}</td><td>${esc(x.unit)} / ${esc(x.method || '-')}</td></tr>`).join('')}</table></div>`; };
  let m = makeMap($('#anM')), lay = [];
  $('#anOut').addEventListener('click', e => { if (e.target.closest('#anPrint') && S._anPrint) { const P = S._anPrint; openMapPrint({ src: m, title: P.title, subtitle: P.sub, legend: P.lgRows, build: pm => P.draw(pm) }); } });
  $('#anMap').onclick = async () => { if (!m) return; lay.forEach(l => m.removeLayer(l)); lay = [];
    const r = await run('analytics.map', Object.assign(f(), { interpolate: $('#anIdw').checked }));
    const vals = r.ssu.features.map(x => x.properties.mean).filter(v => v !== null).concat(r.idw ? r.idw.cells.map(c => c.value) : [], r.points.map(p => p.value)).filter(v => isFinite(v));
    const lo = Math.min(...vals), hi = Math.max(...vals), pal = ['#fef3c7', '#fcd34d', '#f59e0b', '#c2410c', '#7c2d12'];
    const col = v => v === null || v === undefined || !isFinite(v) || !isFinite(lo) ? '#e5e7eb' : pal[Math.max(0, Math.min(4, Math.floor((v - lo) / ((hi - lo) || 1) * 5)))];
    const draw = mm => { const out = []; let g;
    if (r.idw) out.push(L.layerGroup(r.idw.cells.map(c => L.rectangle([[c.lat - c.dLat / 2, c.lng - c.dLng / 2], [c.lat + c.dLat / 2, c.lng + c.dLng / 2]], { stroke: false, fillColor: col(c.value), fillOpacity: .55 }).bindTooltip('PREDIKSI ' + num(c.value, 3)))).addTo(mm));
    g = L.geoJSON(r.ssu, { style: x => ({ color: '#111', weight: 1.5, fillColor: col(x.properties.mean), fillOpacity: r.idw ? 0 : .7, dashArray: r.idw ? '4 3' : null }) }).bindPopup(l => `<b>${esc(l.feature.properties.code)}</b><br>TERUKUR rata-rata: ${num(l.feature.properties.mean, 3)} (n=${l.feature.properties.n})`).addTo(mm); out.push(g);
    out.push(L.layerGroup(r.points.map(p => L.circleMarker([p.lat, p.lng], { radius: 5, color: '#111', weight: 1, fillColor: col(p.value), fillOpacity: 1 }).bindTooltip('TERUKUR ' + esc(p.code) + ': ' + num(p.value, 3)))).addTo(mm));
      return { out, g }; };
    const dd = draw(m); lay.push(...dd.out); const g = dd.g;
    if (r.ssu.features.length) m.fitBounds(g.getBounds());
    const lgRows = pal.map((c, i) => [c, (isFinite(lo) ? num(lo + (hi - lo) * i / 5, 2) + ' – ' + num(lo + (hi - lo) * (i + 1) / 5, 2) : '-')]).concat([['#e5e7eb', 'Tidak ada data'], ['transparent', 'Poligon/titik = TERUKUR', 'border:2px solid #111'], ['transparent', r.idw ? 'Sel arsir = PREDIKSI (IDW)' : 'Tanpa prediksi', 'border:2px dashed #c2410c']]);
    lay.push(legend(m, lgRows));
    S._anPrint = { draw, lgRows, title: 'Peta ' + r.meta.paramCode + ' kedalaman ' + r.meta.depth, sub: (r.idw ? 'TERUKUR + PREDIKSI (IDW)' : 'Rata-rata TERUKUR per SSU') + ' · n = ' + r.meta.n };
    $('#anOut').innerHTML = `<h2>Peta parameter tanah<span class="sp"></span><button class="btn sm pri" id="anPrint">Cetak peta A4/A3</button></h2>${meta(r.meta)}<p>${r.idw ? badge('REVIEW', 'PREDIKSI') + ' ' + esc(r.idw.method) + ' dari ' + r.idw.n + ' titik — bukan pengukuran.' : esc(r.idwReason || '')}</p>${r.warning ? `<p>${badge('REVIEW', r.warning)}</p>` : ''}`; };
};

    $('#rpOut').innerHTML = `<div class="card"><div class="print-only"><img src="${esc(S.settings.logo || DEFAULT_LOGO)}" style="height:48px"> <b>${esc(S.settings.appTitle || '')}</b></div><h2>Laporan kampanye ${esc(r.campaign.code)} — ${esc(r.campaign.name)}</h2>
      <p>Estate ${esc(r.estate.name)} · Protokol ${esc(r.protocol.code)} v${esc(r.protocol.version)} · Periode ${esc(r.campaign.startDate || '-')} s/d ${esc(r.campaign.endDate || '-')} · Status ${badge(r.campaign.status)}</p>
      <div class="grid g4"><div class="kpi"><div class="v">${r.points.observed}/${r.points.total}</div><div class="l">Titik teramati</div></div><div class="kpi"><div class="v">${Object.values(r.samples).reduce((a, b) => a + b, 0)}</div><div class="l">Sampel</div></div><div class="kpi"><div class="v">${r.results.validated}/${r.results.total}</div><div class="l">Hasil tervalidasi</div></div><div class="kpi"><div class="v">${r.recs.length}</div><div class="l">Rekomendasi</div></div></div>
      <h3>Ringkasan parameter (VALIDATED)</h3><table class="tbl"><tr><th>Parameter</th><th>n</th><th>Rata-rata</th><th>Median</th><th>SD</th><th>Min</th><th>Maks</th></tr>${r.summary.map(s => `<tr><td>${esc(s.param)}</td><td>${s.n}</td><td>${num(s.mean, 3)}</td><td>${num(s.median, 3)}</td><td>${num(s.sd, 3)}</td><td>${num(s.min, 3)}</td><td>${num(s.max, 3)}</td></tr>`).join('')}</table>
      <h3>Status sampel</h3><p>${Object.keys(r.samples).map(k => badge(k, k + ' · ' + r.samples[k])).join(' ')}</p><h3>Rekomendasi</h3><p>${r.recs.map(x => esc(x.code) + ' ' + badge(x.status) + ' (' + x.items + ' item)').join('<br>') || '-'}</p>
      <p class="help">Dibuat ${fmtDate(r.generatedAt, 1)} oleh ${esc(r.generatedBy)}. Statistik deskriptif bukan bukti sebab-akibat.</p></div>`; };
  $('#rpCsv').onclick = async () => { const r = await run('report.resultsCsv', { campaignId: $('#rpC').value }); download(r.fileName, '﻿' + r.csv, 'text/csv'); };
  $('#rpGj').onclick = async () => { if (!S.estateId) return toast('Pilih estate di header.', 'bad'); download('ssu.geojson', JSON.stringify(await run('ssu.export', { estateId: S.estateId })), 'application/geo+json'); };
  $('#rpPr').onclick = () => print();
};

/* --------------------------- Pengguna & Hak Akses --------------------------- */
Pages.users = async function () {
  const users = await run('user.list', {}), roles = S.meta.roles, lbl = S.meta.roleLabel;
  C().innerHTML = `<div class="card" id="usc"><div class="tabs"><button class="on" data-t="u">Pengguna</button><button data-t="m">Matriks RBAC</button></div><div id="usB"></div></div>`;
  const listView = () => { $('#usB').innerHTML = `<div class="bar"><input class="in" id="usQ" placeholder="Cari nama/email…" style="max-width:280px"><span class="sp"></span><button class="btn pri" id="usNew">${ic('plus')} Pengguna baru</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Cakupan estate</th><th>Status</th><th>Login terakhir</th><th></th></tr></thead><tbody id="usT"></tbody></table></div>`;
    const draw = q => { const r = users.filter(u => !q || (u.name + u.email).toLowerCase().includes(q.toLowerCase()));
      $('#usT').innerHTML = r.length ? r.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.roles.map(x => `<span class="badge">${esc(lbl[x] || x)}</span>`).join(' ')}</td><td>${u.estates.includes('*') ? 'Semua' : esc(u.estates.map(e => (S.estates.find(x => x.id === e) || {}).code || e.slice(0, 6)).join(', '))}</td><td>${badge(u.active ? 'APPROVED' : 'RETIRED', u.active ? 'Aktif' : 'Nonaktif')}</td><td>${fmtDate(u.lastLogin, 1)}</td><td class="nowrap"><button class="btn sm" data-ed="${esc(u.id)}">Ubah</button> <button class="btn sm" data-rs="${esc(u.id)}">Reset password</button></td></tr>`).join('') : '<tr><td colspan="7"><div class="state">Tidak ada pengguna.</div></td></tr>'; };
    draw(''); $('#usQ').oninput = e => draw(e.target.value);
    $('#usNew').onclick = () => userForm(null); $('#usT').onclick = async e => { const ed = e.target.closest('[data-ed]'), rs = e.target.closest('[data-rs]');
      if (ed) userForm(users.find(u => u.id === ed.dataset.ed));
      if (rs && await confirmBox('Buat password sementara baru untuk pengguna ini?')) { const r = await run('user.resetPassword', { id: rs.dataset.rs }); modal('Password sementara', `<p>Berikan secara langsung kepada pengguna. Ditampilkan <b>sekali</b> dan tidak tercatat di log.</p><p class="mono" style="font-size:18px">${esc(r.tempPassword)}</p>`); } }; };
  async function userForm(u) {
    const f = [{ name: 'name', label: 'Nama', required: true }, { name: 'email', label: 'Email', type: 'email', required: true }, { name: 'roles', label: 'Role', type: 'checks', required: true, options: roles.map(r => ({ value: r, label: lbl[r] })) },
      { name: 'estates', label: 'Cakupan estate', type: 'checks', options: [{ value: '*', label: 'Semua estate (korporat)' }].concat(S.estates.map(e => ({ value: e.id, label: e.code + ' — ' + e.name }))) }, { name: 'active', label: 'Status', type: 'select', required: true, options: [{ value: '1', label: 'Aktif' }, { value: '0', label: 'Nonaktif' }] }];
    const r = await formModal(u ? 'Ubah pengguna' : 'Pengguna baru', f, u ? Object.assign({}, u, { active: u.active ? '1' : '0' }) : { active: '1' }, v => run('user.save', Object.assign(v, { id: u && u.id, active: v.active === '1' }), 'Pengguna disimpan.'));
    if (r) { if (r.tempPassword) await modal('Password sementara', `<p>Akun dibuat. Berikan password sementara ini kepada <b>${esc(r.email)}</b> (ditampilkan sekali, wajib diganti saat login pertama):</p><p class="mono" style="font-size:18px">${esc(r.tempPassword)}</p>`); Pages.users(); }
  }
  const matrix = () => { const perms = [...new Set(Object.values(S.meta.rolePerms).flat())].filter(p => p !== '*').sort();
    $('#usB').innerHTML = `<p class="help">Otorisasi diperiksa di server untuk setiap permintaan; menu yang tersembunyi bukan satu-satunya pengaman. Scope estate membatasi data per pengguna.</p><div class="tbl-wrap"><table class="tbl"><tr><th>Permission</th>${roles.map(r => `<th style="writing-mode:vertical-rl;transform:rotate(180deg)">${esc(lbl[r])}</th>`).join('')}</tr>${perms.map(p => `<tr><td class="mono">${esc(p)}</td>${roles.map(r => { const ps = S.meta.rolePerms[r]; return `<td style="text-align:center">${ps.includes('*') || ps.includes(p) ? '✔' : ''}</td>`; }).join('')}</tr>`).join('')}</table></div>`; };
  $('#usc .tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; $$('#usc .tabs button').forEach(x => x.classList.toggle('on', x === b)); b.dataset.t === 'u' ? listView() : matrix(); };
  listView();
};

/* ------------------------------- Pengaturan ------------------------------- */
Pages.settings = async function () {
  const lic = can('read') ? await api('license.status', {}).catch(() => S.me.license || {}) : (S.me.license || {});
  let est = null; try { est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch (e) {}
  C().innerHTML = `<div class="grid g2"><div class="card"><h2>Profil</h2><div class="bar"><img class="avatar" id="stAv" src="${esc($('#myAvatar').src)}" style="width:84px;height:84px" title="Klik untuk memperbesar"><div><b>${esc(S.me.name)}</b><br><span class="muted">${esc(S.me.email)}</span><br><button class="btn sm" id="stUp">Ganti foto</button> <button class="btn sm danger" id="stDel">Hapus foto</button></div></div>
      <div class="bar"><button class="btn" id="stName">Ubah nama</button><button class="btn" id="stPw">Ganti password</button></div></div>
    <div class="card"><h2>Lisensi</h2><p>${badge(lic.licensed ? 'APPROVED' : 'REJECTED', lic.label || '-')} ${lic.licensed ? '' : esc(lic.reason || '')}</p><p class="muted">Organisasi: ${esc(lic.org || '-')} · Berlaku s/d ${esc(lic.exp || '-')} · Batas ${lic.limits ? lic.limits.estates + ' estate / ' + lic.limits.users + ' pengguna' : '-'}</p>${can('settings.write') ? '<button class="btn pri" id="stLic">Aktifkan kunci lisensi</button>' : ''}</div>
    ${can('settings.write') ? `<div class="card"><h2>Branding</h2><div class="bar"><img class="logo" data-brand-logo style="width:56px;height:56px;border:1px solid var(--line)" title="Klik untuk memperbesar"><div><b data-brand-title></b><br><span class="muted" data-brand-sub></span></div></div><button class="btn" id="stBr">${ic('edit')} Edit judul, logo & warna</button></div>
    <div class="card"><h2>Ambang operasional</h2><p class="help">Diatur oleh perusahaan; bukan standar universal.</p><form id="stOp" onsubmit="return false">${formHtml(OPS)}</form><button class="btn pri" id="stOpS">Simpan ambang</button></div>` : ''}
    ${can('backup') ? `<div class="card"><h2>Backup & pemulihan</h2><p class="help">Backup otomatis harian (30 terakhir) di Google Drive. Uji pemulihan membandingkan isi salinan dengan data aktif.</p><button class="btn pri" id="stBk">Backup sekarang</button> <button class="btn" id="stVf">Uji pemulihan…</button><div id="stBkR"></div></div>` : ''}
    <div class="card"><h2>Perangkat & koneksi</h2><p>Mode: <b>${IS_GAS ? 'Apps Script (online)' : 'PWA'}</b>${IS_GAS ? '' : ` · Server: <span class="mono" style="word-break:break-all">${esc(apiUrl() || '-')}</span>`}</p>
      <p class="muted">Penyimpanan lokal: ${est ? num(est.usage / 1048576, 1) + ' MB dari ' + num(est.quota / 1048576, 0) + ' MB' : '-'}</p><div class="bar">${IS_GAS ? '' : '<button class="btn" id="stApi">Ubah URL server</button>'}<button class="btn danger" id="stWipe">Hapus data lokal perangkat</button></div></div>
    <div class="card"><h2>Versi & dokumen hukum</h2><p>Aplikasi <b class="mono">v${VERSION}</b> (build ${BUILD_DATE}) · dokumen hukum versi ${LEGAL_VERSION}${S.me.consent ? ' · disetujui ' + fmtDate(S.me.consent.at, 1) : ''}</p>
      <div class="bar"><button class="btn" data-lg="about">Tentang & riwayat versi</button><button class="btn" data-lg="terms">Syarat & Ketentuan</button><button class="btn" data-lg="privacy">Pemberitahuan Privasi</button></div>
      ${can('settings.write') ? `<h4>Identitas pada dokumen hukum</h4><form id="stLg" onsubmit="return false">${formHtml(LEGAL_FIELDS, S.settings)}</form><button class="btn pri" id="stLgS">Simpan identitas</button>` : ''}</div>
    <div class="card"><h2>Tentang & lisensi pihak ketiga</h2><p>${esc(S.settings.appTitle || 'SSU Digital Enterprise')} v${VERSION}</p><ul class="muted" style="font-size:12.5px"><li>Leaflet 1.9.4 — BSD-2-Clause</li><li>SheetJS Community Edition 0.20.3 — Apache-2.0</li><li>qrcode-generator 1.4.4 — MIT</li><li>Font Inter — SIL OFL 1.1</li><li>Data peta © OpenStreetMap contributors (ODbL); citra © Esri & penyedia</li></ul></div></div>`;
  applyBranding(); $$('img[data-brand-logo]').forEach(i => i.onclick = () => zoomImage(i.src, 'Logo'));
  $('#stAv').onclick = () => zoomImage($('#stAv').src, 'Foto profil');
  $('#stUp').onclick = async () => { const f = await pickFile('image/jpeg,image/png,image/webp'); if (!f) return; try { const d = await imageToDataUrl(f, 600, 300000); await run('profile.update', { photo: d }, 'Foto profil diperbarui.'); $('#myAvatar').src = d; $('#stAv').src = d; } catch (e) { toast(e.message, 'bad'); } };
  $('#stDel').onclick = async () => { await run('profile.update', { photo: '' }, 'Foto dihapus.'); $('#myAvatar').src = DEFAULT_AVATAR; $('#stAv').src = DEFAULT_AVATAR; };
  $('#stName').onclick = () => formModal('Ubah nama', [{ name: 'name', label: 'Nama', required: true, value: S.me.name }], {}, async v => { await run('profile.update', v, 'Nama diperbarui.'); S.me.name = v.name; });
  $('#stPw').onclick = () => formModal('Ganti password', [{ name: 'oldPassword', label: 'Password lama', type: 'password', required: true }, { name: 'newPassword', label: 'Password baru (min 10, huruf+angka)', type: 'password', required: true }, { name: 'again', label: 'Ulangi', type: 'password', required: true }], {}, v => { if (v.newPassword !== v.again) throw new Error('Password baru tidak sama.'); return run('auth.changePassword', v, 'Password diganti.'); });

  if ($('#stOpS')) { const cur = await api('settings.admin', {}).catch(() => ({})); OPS.forEach(o => { const el = $(`[name="${o.name}"]`); if (el && cur[o.name] !== undefined && cur[o.name] !== '') el.value = cur[o.name]; });
    $('#stOpS').onclick = async () => { const v = formRead($('#stOp'), OPS); if (!v) return; Object.keys(v).forEach(k => { if (v[k] === '') delete v[k]; }); await run('settings.save', v, 'Ambang disimpan.'); }; }
  if ($('#stBk')) { $('#stBk').onclick = async () => { const r = await run('backup.now', {}, 'Backup dibuat.'); $('#stBkR').innerHTML = `<p>${esc(r.name)} · <a href="${esc(r.url)}" target="_blank" rel="noopener">buka</a> · ID <span class="mono">${esc(r.fileId)}</span></p>`; };
    $('#stVf').onclick = () => formModal('Uji pemulihan backup', [{ name: 'fileId', label: 'ID file backup', required: true }], {}, async v => { const r = await run('backup.verify', v); modal('Hasil uji pemulihan', `<p>${badge(r.ok ? 'PASS' : 'FAIL', r.ok ? 'Struktur valid' : 'Ada masalah')}</p><table class="tbl"><tr><th>Tabel</th><th>Baris backup</th><th>Baris aktif</th><th>Header</th></tr>${r.tables.map(t => `<tr><td>${esc(t.table)}</td><td>${t.backupRows}</td><td>${t.liveRows}</td><td>${t.headerOk ? '✔' : '✖'}</td></tr>`).join('')}</table>`, null, { wide: true }); }); }
  if ($('#stApi')) $('#stApi').onclick = configApi;
  $$('[data-lg]').forEach(b => b.onclick = () => showLegal(b.dataset.lg));

  $('#stWipe').onclick = async () => { const n = (await IDB.qAll()).filter(o => o.status !== 'DONE').length; if (await confirmBox('Hapus paket tugas & antrean lokal' + (n ? ' (' + n + ' BELUM TERSINKRON akan hilang)' : '') + '?')) { await IDB.wipe(); Sync.badge(); toast('Data lokal dihapus.', 'ok'); } };
};
const LEGAL_FIELDS = [{ name: 'orgName', label: 'Nama organisasi (Pengendali Data)', help: 'mis. PT Contoh Sawit Lestari' }, { name: 'providerName', label: 'Nama penyedia aplikasi' }, { name: 'privacyContact', label: 'Email kontak privasi / Pejabat PDP', type: 'email' }];
const OPS_DOC = { name: 'docPublicLink', label: 'Foto dokumentasi: bagikan tautan Google Drive', type: 'select', options: [{ value: 'false', label: 'Tidak — hanya lewat aplikasi (disarankan, sesuai hak akses)' }, { value: 'true', label: 'Ya — siapa pun yang punya tautan dapat melihat' }] };
const OPS = [{ name: 'fieldMaxDeviationM', label: 'Batas deviasi titik aktual vs rencana (m)', type: 'number', min: 0 }, { name: 'fieldMaxAccuracyM', label: 'Batas akurasi GPS (m)', type: 'number', min: 0 }, { name: 'idwMinPoints', label: 'Minimum titik untuk interpolasi IDW', type: 'number', min: 3 }, { name: 'transitMaxDays', label: 'Maks hari sampel dalam perjalanan (0 = nonaktif)', type: 'number', min: 0 }, OPS_DOC];

/* ------------------------------ Start ------------------------------ */
window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if (S.me && p && p !== S.page && Pages[p]) go(p); });
if ('serviceWorker' in navigator && !IS_GAS && !window.SSU_DEMO_BUILD && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (window.SSU_DEMO_BUILD) window.__ssuStart = boot; else boot();   // versi demo menyiapkan data dulu
